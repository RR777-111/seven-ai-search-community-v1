name: seven-ai-search-community-v1
services:
  web:
    build:
      context: .
      target: web
      args:
        API_BASE_URL: http://api:3001
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
      WEB_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    networks: [community]
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      APP_PORT: 3001
      APP_HOST: 0.0.0.0
      PANSOU_BASE_URL: http://pansou:8888
      PANSOU_TIMEOUT_MS: 10000
      REDIS_URL: redis://redis:6379
      TRUST_PROXY_HOPS: 1
      SEARCH_TIMEOUT: 10000
      SEARCH_FETCH_TIME_BUDGET_MS: 6000
      SEARCH_CACHE_ENABLED: "true"
      SEARCH_CACHE_TTL: 300
      SEARCH_CACHE_MAX_SIZE: 100
    depends_on:
      redis:
        condition: service_started
      pansou:
        condition: service_started
    networks: [community]
  pansou:
    image: ghcr.io/fish2018/pansou@sha256:d371fe5caa87794414dd54cda063fcfc456d5013e18b65dbf1f6ca17f6299492
    environment:
      PORT: 8888
      ASYNC_RESPONSE_TIMEOUT: 2
      AUTH_ENABLED: "false"
    networks: [community]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [community]
networks:
  community:
    ipam:
      config:
        - subnet: ${COMMUNITY_SUBNET:-10.200.250.0/24}
volumes:
  redis_data: {}
