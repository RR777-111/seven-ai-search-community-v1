name: seven-ai-search-community-v1
services:
  web:
    build:
      context: .
      target: web
      args:
        API_BASE_URL: http://api:3001
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
      WEB_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [community]
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      APP_PORT: 3001
      APP_HOST: 0.0.0.0
      PANSOU_BASE_URL: ${PANSOU_BASE_URL:-http://pansou:8888}
      PANSOU_TIMEOUT_MS: 10000
      REDIS_URL: redis://redis:6379
      TRUST_PROXY_HOPS: 1
      SEARCH_TIMEOUT: 10000
      SEARCH_FETCH_TIME_BUDGET_MS: 6000
      SEARCH_CACHE_ENABLED: "true"
      SEARCH_CACHE_TTL: 300
      SEARCH_CACHE_MAX_SIZE: 100
    depends_on:
      redis:
        condition: service_healthy
      pansou:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [community]
  pansou:
    build:
      context: .
      dockerfile: docker/pansou.Dockerfile
    environment:
      PORT: 8888
      AUTH_ENABLED: "false"
      INSECURE_SKIP_TLS_VERIFY: "false"
      ENABLED_PLUGINS: pansearch,hunhepan
      CHANNELS: tgsearchers7,Aliyun_4K_Movies,Baidu_netdisk,yunpanxunlei,pxyunpanxunlei,XunLeiPinDao,ucwpzy,ucshare,ucquark,Quark_Movies,xxzlzn,xuexiziliaobaibaoku
      ASYNC_RESPONSE_TIMEOUT: 4
      PLUGIN_TIMEOUT: 12
      CONCURRENCY: 16
      PROXY: ${PANSOU_PROXY:-}
      CACHE_PATH: /app/cache
    volumes:
      - pansou_cache:/app/cache
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8888/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    networks: [community]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [community]
networks:
  community:
    ipam:
      config:
        - subnet: ${COMMUNITY_SUBNET:-10.200.250.0/24}
volumes:
  redis_data: {}
  pansou_cache: {}
