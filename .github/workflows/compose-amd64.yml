name: Community Compose AMD64

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      task:
        description: Choose the existing image publication or the fixed AMD64 offline archive
        required: true
        type: choice
        options:
          - publish-images
          - offline-amd64
        default: publish-images

permissions:
  contents: read

jobs:
  compose-amd64:
    if: github.event_name != 'workflow_dispatch' || inputs.task != 'offline-amd64'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: community-ci
      COMPOSE_FILE: compose.yaml:compose.build.yaml
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      BUILDKIT_PROGRESS: plain
      WEB_PORT: '3000'
    defaults:
      run:
        shell: bash
    steps:
      - name: Fresh checkout of the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify native AMD64 and Compose configuration
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/community-ci"
          test "$(uname -m)" = x86_64
          test "$(docker version --format '{{.Server.Arch}}')" = amd64
          git rev-parse HEAD | tee "$RUNNER_TEMP/community-ci/checkout-sha.txt"
          docker compose version
          docker compose config --quiet

      - name: Pull Redis and build without cache
        run: |
          set -euo pipefail
          docker compose pull redis 2>&1 | tee "$RUNNER_TEMP/community-ci/redis-pull.log"
          docker compose build --no-cache --pull 2>&1 | tee "$RUNNER_TEMP/community-ci/build.log"

      - name: Start all four services and require healthy state
        run: |
          set -euo pipefail
          docker compose up --no-build --wait --wait-timeout 180 2>&1 | tee "$RUNNER_TEMP/community-ci/startup.log"
          for service in web api pansou redis; do
            container="$(docker compose ps -q "$service")"
            test -n "$container"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
            image="$(docker inspect --format '{{.Image}}' "$container")"
            test "$(docker image inspect --format '{{.Architecture}}' "$image")" = amd64
          done

      - name: Verify homepage and health interfaces
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/ > "$RUNNER_TEMP/community-ci/homepage.html"
          grep -q 'Seven AI Search' "$RUNNER_TEMP/community-ci/homepage.html"
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/health > "$RUNNER_TEMP/community-ci/web-health.json"
          python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/community-ci/web-health.json"))["status"] == "ok"'
          docker compose exec -T api node -e '
            const assert = require("node:assert/strict");
            (async () => {
              for (const url of ["http://127.0.0.1:3001/health", "http://pansou:8888/api/health"]) {
                const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
                assert.equal(response.status, 200);
                console.log(url, await response.text());
              }
            })().catch(error => { console.error(error); process.exit(1); });
          ' | tee "$RUNNER_TEMP/community-ci/internal-health.log"
          test "$(docker compose exec -T redis redis-cli ping)" = PONG

      - name: Collect service diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/community-ci"
          docker compose ps -a --format json > "$RUNNER_TEMP/community-ci/services.json" 2>&1 || true
          docker compose logs --no-color --tail 200 > "$RUNNER_TEMP/community-ci/services.log" 2>&1 || true

      - name: Preserve build, startup and probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/community-ci/
          if-no-files-found: warn

  install-prebuilt-amd64:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: community-prebuilt-ci
      WEB_PORT: '3000'
    steps:
      - name: Fresh checkout of the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pinned public images without build or credentials
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test ! -e .env
          docker compose config --quiet
          docker compose config --format json | jq -e 'all(.services[]; has("build") | not)'
          docker compose pull
          docker compose up --no-build --wait --wait-timeout 180 -d
          for service in web api pansou redis; do
            container="$(docker compose ps -q "$service")"
            test -n "$container"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
            image="$(docker inspect --format '{{.Image}}' "$container")"
            test "$(docker image inspect --format '{{.Architecture}}' "$image")" = amd64
          done
          for service in web api pansou; do
            docker compose exec -T "$service" test -s /usr/share/licenses/community/LICENSE
            docker compose exec -T "$service" test -s /usr/share/licenses/community/THIRD_PARTY_NOTICES.md
            docker compose exec -T "$service" test -s /usr/share/licenses/community/third-party/LGPL-3.0.txt
          done
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/ > "$RUNNER_TEMP/community-homepage.html"
          grep -q 'Seven AI Search' "$RUNNER_TEMP/community-homepage.html"
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/health | jq -e '.status == "ok"'
          docker compose exec -T api node -e '
            (async () => {
              for (const url of ["http://127.0.0.1:3001/health", "http://pansou:8888/api/health"]) {
                const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
                if (!response.ok) process.exit(1);
              }
            })().catch(() => process.exit(1));
          '
          test "$(docker compose exec -T redis redis-cli ping)" = PONG

      - name: Preserve service diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail 100 || true

  publish-candidate-images:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'publish-images' && startsWith(github.ref, 'refs/heads/release/v1.0.1-')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            file: ./Dockerfile
            target: web
          - service: api
            file: ./Dockerfile
            target: api
          - service: pansou
            file: ./docker/pansou.Dockerfile
            target: ''
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable ARM64 builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Authenticate to GHCR with the repository token
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish both Linux architectures
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/rr777-111/seven-ai-search-community-v1-${{ matrix.service }}:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/RR777-111/seven-ai-search-community-v1
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          test "$IMAGE_DIGEST" != ""
          echo "ghcr.io/rr777-111/seven-ai-search-community-v1-${SERVICE}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  offline-amd64:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'offline-amd64' && github.ref == 'refs/heads/release/v1.0.1-quality-197fa7d'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Bind the existing candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 197fa7d451386bf95c53512399f5f7070275a240
          persist-credentials: false

      - name: Verify native AMD64 and frozen source
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(docker version --format '{{.Server.Arch}}')" = amd64
          test "$(git rev-parse HEAD)" = 197fa7d451386bf95c53512399f5f7070275a240
          docker buildx version
          df -h "$RUNNER_TEMP"

      - name: Pull, identify, export and verify four fixed images
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/offline-amd64"
          mkdir -p "$out"
          map="$out/IMAGE_MAP.tsv"
          printf 'service\tindex_ref\tamd64_manifest_digest\timage_id\tlocal_tag\tsource_revision\n' > "$map"
          records=(
            'web|ghcr.io/rr777-111/seven-ai-search-community-v1-web@sha256:b88c079f9260d9b6d6c99fe812c67de925ad73a0fe0687c5ce4796eae7f6809d|seven-ai-search-community-v1-web:offline-amd64-197fa7d-b88c079f'
            'api|ghcr.io/rr777-111/seven-ai-search-community-v1-api@sha256:3e35b238f7405f9f82148e9bf171825112293633a6a0a0f748161d77d09cfc42|seven-ai-search-community-v1-api:offline-amd64-197fa7d-3e35b238'
            'pansou|ghcr.io/rr777-111/seven-ai-search-community-v1-pansou@sha256:8a02eb45f8f23c17a63161b4579924a57cec3a876564a0e891717e4cec93ab36|seven-ai-search-community-v1-pansou:offline-amd64-197fa7d-8a02eb45'
            'redis|redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541|seven-ai-search-community-v1-redis:offline-amd64-197fa7d-57e4255c'
          )
          tags=()
          refs=()
          for record in "${records[@]}"; do
            IFS='|' read -r service ref tag <<< "$record"
            raw="$(docker buildx imagetools inspect --raw "$ref")"
            amd64_manifest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] | if length == 1 then .[0] else error("expected exactly one linux/amd64 manifest") end' <<< "$raw")"
            platform_manifest="$(docker buildx imagetools inspect --raw "${ref%@*}@${amd64_manifest}")"
            jq -e '.layers | length > 0' <<< "$platform_manifest" > /dev/null
            if jq -e 'any(.layers[]; .mediaType | contains("zstd"))' <<< "$platform_manifest" > /dev/null; then
              echo "UNSUPPORTED_LAYER_COMPRESSION=zstd for $service"
              exit 1
            fi
            if ! docker pull --platform linux/amd64 --quiet "$ref" > "$out/${service}-pull-raw.log" 2>&1; then
              python3 - "$out/${service}-pull-raw.log" <<'PY'
          import re, sys
          raw = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          print(re.sub(r'https?://[^\s"\x27]+', '[registry-URL-redacted]', raw)[-3000:])
          PY
              exit 1
            fi
            platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$ref")"
            test "$platform" = linux/amd64
            image_id="$(docker image inspect --format '{{.Id}}' "$ref")"
            revision='-'
            if test "$service" != redis; then
              revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$ref")"
              test "$revision" = 197fa7d451386bf95c53512399f5f7070275a240
            fi
            docker image tag "$ref" "$tag"
            test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$image_id"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$service" "$ref" "$amd64_manifest" "$image_id" "$tag" "$revision" >> "$map"
            tags+=("$tag")
            refs+=("$ref")
          done
          test "${#tags[@]}" -eq 4
          archive="$out/offline-images-linux-amd64.tar"
          docker image save --platform linux/amd64 --output "$archive" "${tags[@]}"
          python3 - "$archive" "$map" <<'PY'
          import bz2, csv, gzip, hashlib, json, lzma, sys, tarfile
          def hash_stream(stream):
              digest = hashlib.sha256()
              while chunk := stream.read(8 * 1024 * 1024):
                  digest.update(chunk)
              return 'sha256:' + digest.hexdigest()
          archive, mapping = sys.argv[1:]
          with open(mapping, newline='', encoding='utf-8') as stream:
              rows = list(csv.DictReader(stream, delimiter='\t'))
          assert len(rows) == 4
          with tarfile.open(archive, mode='r:') as saved:
              names = {member.name for member in saved.getmembers()}
              manifest = json.load(saved.extractfile('manifest.json'))
              tagged = {tag: entry for entry in manifest for tag in entry.get('RepoTags', [])}
              assert set(tagged) == {row['local_tag'] for row in rows}
              checked_layers = {}
              for row in rows:
                  entry = tagged[row['local_tag']]
                  config_name = entry['Config']
                  assert config_name in names
                  config_bytes = saved.extractfile(config_name).read()
                  assert 'sha256:' + hashlib.sha256(config_bytes).hexdigest() == row['image_id']
                  config = json.loads(config_bytes)
                  assert (config['os'], config['architecture']) == ('linux', 'amd64')
                  layers = entry['Layers']
                  diff_ids = config['rootfs']['diff_ids']
                  assert len(layers) == len(diff_ids)
                  for layer, expected in zip(layers, diff_ids):
                      assert layer in names
                      if layer not in checked_layers:
                          with saved.extractfile(layer) as content:
                              raw_digest = hash_stream(content)
                          if layer.startswith('blobs/sha256/'):
                              assert raw_digest == 'sha256:' + layer.rsplit('/', 1)[-1]
                          expanded_digest = raw_digest
                          if raw_digest != expected:
                              with saved.extractfile(layer) as probe:
                                  magic = probe.read(8)
                              if magic.startswith(b'\x1f\x8b'):
                                  with saved.extractfile(layer) as content:
                                      with gzip.GzipFile(fileobj=content) as expanded:
                                          expanded_digest = hash_stream(expanded)
                              elif magic.startswith(b'BZh'):
                                  with saved.extractfile(layer) as content:
                                      with bz2.BZ2File(content) as expanded:
                                          expanded_digest = hash_stream(expanded)
                              elif magic.startswith(b'\xfd7zXZ\x00'):
                                  with saved.extractfile(layer) as content:
                                      with lzma.LZMAFile(content) as expanded:
                                          expanded_digest = hash_stream(expanded)
                              elif magic.startswith(b'\x28\xb5\x2f\xfd'):
                                  raise RuntimeError('UNSUPPORTED_LAYER_COMPRESSION=zstd')
                              else:
                                  raise AssertionError('saved layer bytes differ from diff_id and compression is unknown')
                          checked_layers[layer] = expanded_digest
                      assert checked_layers[layer] == expected
          print('Four AMD64 tags, configs and all saved layer checksums verified')
          PY
          gzip -6 "$archive"
          cd "$out"
          sha256sum offline-images-linux-amd64.tar.gz IMAGE_MAP.tsv > SHA256SUMS.txt
          upload_bytes="$(stat -c '%s' offline-images-linux-amd64.tar.gz IMAGE_MAP.tsv SHA256SUMS.txt | awk '{sum += $1} END {printf "%.0f", sum}')"
          if test "$upload_bytes" -gt 999000000; then
            echo "Upload files exceed the 999 MB safety bound; no artifact will be uploaded"
            exit 1
          fi
          docker image rm -f "${tags[@]}" "${refs[@]}"
          for tag in "${tags[@]}"; do
            if docker image inspect "$tag" > /dev/null 2>&1; then
              echo "Image tag remained before offline import: $tag"
              exit 1
            fi
          done
          docker image load --input offline-images-linux-amd64.tar.gz
          while IFS=$'\t' read -r service ref amd64_manifest image_id tag revision; do
            test "$service" != service || continue
            test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$image_id"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$tag")" = linux/amd64
          done < IMAGE_MAP.tsv
          echo 'Offline Docker load verified all four fixed tags on the isolated AMD64 runner'
          stat -c '%n %s bytes' offline-images-linux-amd64.tar.gz IMAGE_MAP.tsv SHA256SUMS.txt

      - name: Preserve only the complete checked archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/offline-amd64/offline-images-linux-amd64.tar.gz
            ${{ runner.temp }}/offline-amd64/IMAGE_MAP.tsv
            ${{ runner.temp }}/offline-amd64/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
