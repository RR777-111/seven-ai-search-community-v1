name: Community Compose AMD64

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: community-ci
      COMPOSE_FILE: compose.yaml:compose.build.yaml
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      BUILDKIT_PROGRESS: plain
      WEB_PORT: '3000'
    defaults:
      run:
        shell: bash
    steps:
      - name: Fresh checkout of the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify native AMD64 and Compose configuration
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/community-ci"
          test "$(uname -m)" = x86_64
          test "$(docker version --format '{{.Server.Arch}}')" = amd64
          git rev-parse HEAD | tee "$RUNNER_TEMP/community-ci/checkout-sha.txt"
          docker compose version
          docker compose config --quiet

      - name: Pull Redis and build without cache
        run: |
          set -euo pipefail
          docker compose pull redis 2>&1 | tee "$RUNNER_TEMP/community-ci/redis-pull.log"
          docker compose build --no-cache --pull 2>&1 | tee "$RUNNER_TEMP/community-ci/build.log"

      - name: Start all four services and require healthy state
        run: |
          set -euo pipefail
          docker compose up --no-build --wait --wait-timeout 180 2>&1 | tee "$RUNNER_TEMP/community-ci/startup.log"
          for service in web api pansou redis; do
            container="$(docker compose ps -q "$service")"
            test -n "$container"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
            image="$(docker inspect --format '{{.Image}}' "$container")"
            test "$(docker image inspect --format '{{.Architecture}}' "$image")" = amd64
          done

      - name: Verify homepage and health interfaces
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/ > "$RUNNER_TEMP/community-ci/homepage.html"
          grep -q 'Seven AI Search' "$RUNNER_TEMP/community-ci/homepage.html"
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/health > "$RUNNER_TEMP/community-ci/web-health.json"
          python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/community-ci/web-health.json"))["status"] == "ok"'
          docker compose exec -T api node -e '
            const assert = require("node:assert/strict");
            (async () => {
              for (const url of ["http://127.0.0.1:3001/health", "http://pansou:8888/api/health"]) {
                const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
                assert.equal(response.status, 200);
                console.log(url, await response.text());
              }
            })().catch(error => { console.error(error); process.exit(1); });
          ' | tee "$RUNNER_TEMP/community-ci/internal-health.log"
          test "$(docker compose exec -T redis redis-cli ping)" = PONG

      - name: Collect service diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/community-ci"
          docker compose ps -a --format json > "$RUNNER_TEMP/community-ci/services.json" 2>&1 || true
          docker compose logs --no-color --tail 200 > "$RUNNER_TEMP/community-ci/services.log" 2>&1 || true

      - name: Preserve build, startup and probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/community-ci/
          if-no-files-found: warn

  install-prebuilt-amd64:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: community-prebuilt-ci
      WEB_PORT: '3000'
    steps:
      - name: Fresh checkout of the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pinned public images without build or credentials
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test ! -e .env
          docker compose config --quiet
          docker compose config --format json | jq -e 'all(.services[]; has("build") | not)'
          docker compose pull
          docker compose up --no-build --wait --wait-timeout 180 -d
          for service in web api pansou redis; do
            container="$(docker compose ps -q "$service")"
            test -n "$container"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
            image="$(docker inspect --format '{{.Image}}' "$container")"
            test "$(docker image inspect --format '{{.Architecture}}' "$image")" = amd64
          done
          for service in web api pansou; do
            docker compose exec -T "$service" test -s /usr/share/licenses/community/LICENSE
            docker compose exec -T "$service" test -s /usr/share/licenses/community/THIRD_PARTY_NOTICES.md
            docker compose exec -T "$service" test -s /usr/share/licenses/community/third-party/LGPL-3.0.txt
          done
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/ > "$RUNNER_TEMP/community-homepage.html"
          grep -q 'Seven AI Search' "$RUNNER_TEMP/community-homepage.html"
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/health | jq -e '.status == "ok"'
          docker compose exec -T api node -e '
            (async () => {
              for (const url of ["http://127.0.0.1:3001/health", "http://pansou:8888/api/health"]) {
                const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
                if (!response.ok) process.exit(1);
              }
            })().catch(() => process.exit(1));
          '
          test "$(docker compose exec -T redis redis-cli ping)" = PONG

      - name: Preserve service diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail 100 || true

  publish-candidate-images:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/v1.0.1-')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            file: ./Dockerfile
            target: web
          - service: api
            file: ./Dockerfile
            target: api
          - service: pansou
            file: ./docker/pansou.Dockerfile
            target: ''
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable ARM64 builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Authenticate to GHCR with the repository token
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish both Linux architectures
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/rr777-111/seven-ai-search-community-v1-${{ matrix.service }}:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/RR777-111/seven-ai-search-community-v1
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          test "$IMAGE_DIGEST" != ""
          echo "ghcr.io/rr777-111/seven-ai-search-community-v1-${SERVICE}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
